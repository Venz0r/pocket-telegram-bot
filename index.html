<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Trade Control</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      background: #0b110e; color: #eaffef;
      font: 16px Arial, sans-serif;
    }
    .app { max-width: 480px; margin: auto; }
    .panel {
      background: #151f19; border: 1px solid #294533;
      border-radius: 16px; padding: 16px; margin: 14px 0;
    }
    h1 { color: #61ff99; font-size: 23px; }
    label { display: block; margin: 14px 0 7px; color: #b9d6c3; }
    select, input, button {
      width: 100%; padding: 13px; border-radius: 10px;
      font-size: 16px;
    }
    select, input {
      background: #0d1711; color: white;
      border: 1px solid #385443;
    }
    button { border: 0; font-weight: bold; margin-top: 10px; }
    #start { background: #5cff91; color: #07130a; }
    #stop { background: #3b2428; color: #ffb5bd; }
    .muted { color: #9ab4a2; font-size: 13px; }
    #status { color: #5cff91; font-weight: bold; }
    #log { font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<div class="app">
  <h1>◈ POCKET TRADE</h1>
  <p class="muted">TELEGRAM MINI APP · DEMO</p>

  <div class="panel">
    <p>Режим: <b>СИМУЛЯЦИЯ</b></p>
    <p>Статус: <span id="status">ОСТАНОВЛЕН</span></p>

    <label for="asset">Инструмент</label>
    <select id="asset">
      <option>EUR/USD</option>
      <option>GBP/USD</option>
      <option>USD/JPY</option>
    </select>

    <label for="stake">Тестовая сумма ($)</label>
    <input id="stake" type="number" min="1" max="10"
           value="1" step="1">

    <button id="start">▶ START</button>
    <button id="stop">■ STOP</button>
  </div>

  <div class="panel">
    <h3>Журнал</h3>
    <div id="log">Приложение готово к тесту.</div>
    <p class="muted">
      Сигналы демонстрационные. Рыночные данные не подключены.
      Сделки брокеру не отправляются.
    </p>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const status = document.getElementById("status");
  const log = document.getElementById("log");
  const start = document.getElementById("start");
  const stop = document.getElementById("stop");
  let running = false;
  let timer = null;

  function write(message) {
    const line = document.createElement("div");
    line.textContent = new Date().toLocaleTimeString() + " — " + message;
    log.prepend(line);
  }

  start.addEventListener("click", () => {
    if (running) return;

    const stake = Number(document.getElementById("stake").value);
    if (!Number.isFinite(stake) || stake < 1 || stake > 10) {
      write("Ошибка: тестовая сумма должна быть от $1 до $10.");
      return;
    }

    running = true;
    status.textContent = "DEMO ЗАПУЩЕН";
    write("Запущена симуляция. Торговых заявок нет.");

    timer = setInterval(() => {
      if (!running) return;
      const asset = document.getElementById("asset").value;
      write("Тестовый цикл: " + asset +
            ". Сумма $" + stake + ". Сигнал не рассчитывается.");
    }, 10000);
  });

  stop.addEventListener("click", () => {
    running = false;
    clearInterval(timer);
    timer = null;
    status.textContent = "ОСТАНОВЛЕН";
    write("STOP: тестовый цикл остановлен.");
  });
</script>
</body>
</html>
