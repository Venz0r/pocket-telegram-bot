<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Trade Control</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      background: #0b110e; color: #eaffef;
      font: 16px Arial, sans-serif;
    }
    .app { max-width: 480px; margin: auto; }
    .panel {
      background: #151f19; border: 1px solid #294533;
      border-radius: 16px; padding: 16px; margin: 14px 0;
    }
    h1 { color: #61ff99; font-size: 23px; }
    label { display: block; margin: 14px 0 7px; color: #b9d6c3; }
    select, input, button {
      width: 100%; padding: 13px; border-radius: 10px;
      font-size: 16px;
    }
    select, input {
      background: #0d1711; color: white;
      border: 1px solid #385443;
    }
    button { border: 0; font-weight: bold; margin-top: 10px; }
    button:disabled { opacity: .5; }
    #start { background: #5cff91; color: #07130a; }
    #stop { background: #3b2428; color: #ffb5bd; }
    .muted { color: #9ab4a2; font-size: 13px; }
    #status { color: #5cff91; font-weight: bold; }
    #log { font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<div class="app">
  <h1>◈ POCKET TRADE</h1>
  <p class="muted">TELEGRAM MINI APP · DEMO</p>

  <div class="panel">
    <p>Режим: <b>СИМУЛЯЦИЯ</b></p>
    <p>Статус: <span id="status">ПОДКЛЮЧЕНИЕ...</span></p>

    <label for="asset">Инструмент</label>
    <select id="asset">
      <option>EUR/USD</option>
      <option>GBP/USD</option>
      <option>USD/JPY</option>
    </select>

    <label for="stake">Тестовая сумма ($)</label>
    <input id="stake" type="number" min="1" max="10"
           value="1" step="1">

    <button id="start">▶ START</button>
    <button id="stop">■ STOP</button>
  </div>

  <div class="panel">
    <h3>Журнал</h3>
    <div id="log">Подключаем сервер...</div>
    <p class="muted">
      Только симуляция. Рыночные данные не подключены.
      Сделки брокеру не отправляются.
    </p>
  </div>
</div>

<script>
  // Вставь свои значения из Supabase.
  const SUPABASE_URL = "https://hmhzyjykxnkgcyptxnby.supabase.co/rest/v1/";
  const SUPABASE_KEY = "sb_publishable_UwfPurTYDg3DKAC_IkGvCg_ZB4oseye";

  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const statusEl = document.getElementById("status");
  const log = document.getElementById("log");
  const start = document.getElementById("start");
  const stop = document.getElementById("stop");
  const asset = document.getElementById("asset");
  const stakeInput = document.getElementById("stake");

  let running = false;
  let timer = null;
  let busy = false;

  function write(message) {
    const line = document.createElement("div");
    line.textContent = new Date().toLocaleTimeString() + " — " + message;
    log.prepend(line);
  }

  function setBusy(value) {
    busy = value;
    start.disabled = value;
    stop.disabled = value;
  }

  async function serverRequest(action) {
    if (!tg?.initData) {
      throw new Error(
        "Открой приложение через кнопку меню Telegram. Данные авторизации не получены."
      );
    }

    if (!SUPABASE_URL.startsWith("https://") ||
        SUPABASE_KEY.startsWith("ВСТАВЬ_")) {
      throw new Error("Сначала укажи Project URL и Publishable key Supabase.");
    }

    const response = await fetch(
      SUPABASE_URL.replace(/\/+$/, "") + "/functions/v1/bot-control",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY
        },
        body: JSON.stringify({
          initData: tg.initData,
          action,
          instrument: asset.value,
          amount: Number(stakeInput.value)
        })
      }
    );

    const data = await response.json().catch(() => ({}));

    if (!response.ok || !data.ok) {
      throw new Error(data.error || ("Ошибка сервера: " + response.status));
    }return data;
  }

  function showServerEvents(events) {
    if (!Array.isArray(events)) return;
    log.replaceChildren();

    if (events.length === 0) {
      write("Сервер подключён. Событий пока нет.");
      return;
    }

    for (const event of events) {
      const line = document.createElement("div");
      const time = event.created_at
        ? new Date(event.created_at).toLocaleTimeString()
        : "";
      line.textContent = time + " — " + event.message;
      log.appendChild(line);
    }
  }

  async function loadStatus() {
    try {
      const data = await serverRequest("status");
      showServerEvents(data.events);
      running = Boolean(data.session?.is_running);
      statusEl.textContent = running
        ? "DEMO ЗАПУЩЕН (СЕРВЕР)"
        : "ОСТАНОВЛЕН (СЕРВЕР)";
      if (running) {
        write("Сервер сообщает, что симуляция ранее была запущена. Таймер автоматически не возобновлён.");
      }
    } catch (error) {
      statusEl.textContent = "НЕТ ПОДКЛЮЧЕНИЯ";
      write(error.message);
    }
  }

  start.addEventListener("click", async () => {
    if (busy || running) return;

    const amount = Number(stakeInput.value);
    if (!Number.isFinite(amount) || amount < 1 || amount > 10) {
      write("Ошибка: тестовая сумма должна быть от $1 до $10.");
      return;
    }

    setBusy(true);
    try {
      await serverRequest("start");
      running = true;
      statusEl.textContent = "DEMO ЗАПУЩЕН (СЕРВЕР)";
      write("Сервер подтвердил START. Торговых заявок нет.");

      timer = setInterval(() => {
        if (!running) return;
        write("Тестовый цикл: " + asset.value +
          ". Сумма $" + amount + ". Рыночный сигнал не рассчитывается.");
      }, 10000);
    } catch (error) {
      write("START не выполнен: " + error.message);
    } finally {
      setBusy(false);
    }
  });

  stop.addEventListener("click", async () => {
    if (busy) return;

    setBusy(true);
    try {
      await serverRequest("stop");
      running = false;
      clearInterval(timer);
      timer = null;
      statusEl.textContent = "ОСТАНОВЛЕН (СЕРВЕР)";
      write("Сервер подтвердил STOP. Симуляция остановлена.");
    } catch (error) {
      write("STOP не подтверждён сервером: " + error.message);
    } finally {
      setBusy(false);
    }
  });

  loadStatus();
</script>
</body>
</html>
